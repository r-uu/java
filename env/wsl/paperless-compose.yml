services:
  paperless-broker:
    image: redis:7-alpine
    container_name: paperless-broker
    restart: unless-stopped
    networks:
      - ruu-network

  paperless-webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.14.2
    container_name: paperless-webserver
    command: ["webserver"]
    depends_on:
      - paperless-broker
    environment:
      PAPERLESS_DOCKER: "true"
      PAPERLESS_REDIS: "redis://paperless-broker:6379"
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_SECRET_KEY: change-me
      PAPERLESS_URL: http://localhost:8000
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_TIME_ZONE: Europe/Berlin
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"
    ports:
      - "8000:8000"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    restart: unless-stopped
    networks:
      - ruu-network

  paperless-consumer:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.14.2
    container_name: paperless-consumer
    command: ["consumer"]
    depends_on:
      - paperless-broker
    environment:
      PAPERLESS_DOCKER: "true"
      PAPERLESS_REDIS: "redis://paperless-broker:6379"
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_SECRET_KEY: change-me
      PAPERLESS_URL: http://localhost:8000
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_TIME_ZONE: Europe/Berlin
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    restart: unless-stopped
    networks:
      - ruu-network

  paperless-scheduler:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.14.2
    container_name: paperless-scheduler
    command: ["scheduler"]
    depends_on:
      - paperless-broker
    environment:
      PAPERLESS_DOCKER: "true"
      PAPERLESS_REDIS: "redis://paperless-broker:6379"
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_SECRET_KEY: change-me
      PAPERLESS_URL: http://localhost:8000
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_TIME_ZONE: Europe/Berlin
      USERMAP_UID: "1000"
      USERMAP_GID: "1000"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    restart: unless-stopped
    networks:
      - ruu-network

volumes:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:

networks:
  ruu-network:
    external: true
    name: ruu-network
